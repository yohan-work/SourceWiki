name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PATH: /opt/sourcewiki
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image names
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "SOURCEWIKI_API_IMAGE=ghcr.io/$OWNER_LOWER/sourcewiki-api:$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "SOURCEWIKI_WEB_IMAGE=ghcr.io/$OWNER_LOWER/sourcewiki-web:$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "SOURCEWIKI_API_MAIN_IMAGE=ghcr.io/$OWNER_LOWER/sourcewiki-api:main" >> "$GITHUB_ENV"
          echo "SOURCEWIKI_WEB_MAIN_IMAGE=ghcr.io/$OWNER_LOWER/sourcewiki-web:main" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.SOURCEWIKI_API_IMAGE }}
            ${{ env.SOURCEWIKI_API_MAIN_IMAGE }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.SOURCEWIKI_WEB_IMAGE }}
            ${{ env.SOURCEWIKI_WEB_MAIN_IMAGE }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/sourcewiki_deploy_key
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/sourcewiki_deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload production compose files
        run: |
          ssh -i ~/.ssh/sourcewiki_deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p $DEPLOY_PATH/infra"
          scp -i ~/.ssh/sourcewiki_deploy_key compose.production.yaml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$DEPLOY_PATH/compose.production.yaml"
          scp -i ~/.ssh/sourcewiki_deploy_key infra/Caddyfile.production "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$DEPLOY_PATH/infra/Caddyfile.production"

      - name: Deploy on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/sourcewiki_deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd $DEPLOY_PATH && \
            test -f .env.production && \
            printf '%s\n' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
            SOURCEWIKI_API_IMAGE='$SOURCEWIKI_API_IMAGE' SOURCEWIKI_WEB_IMAGE='$SOURCEWIKI_WEB_IMAGE' docker compose --env-file .env.production -f compose.production.yaml pull && \
            SOURCEWIKI_API_IMAGE='$SOURCEWIKI_API_IMAGE' SOURCEWIKI_WEB_IMAGE='$SOURCEWIKI_WEB_IMAGE' docker compose --env-file .env.production -f compose.production.yaml run --rm api pnpm --filter @sourcewiki/api db:deploy && \
            SOURCEWIKI_API_IMAGE='$SOURCEWIKI_API_IMAGE' SOURCEWIKI_WEB_IMAGE='$SOURCEWIKI_WEB_IMAGE' docker compose --env-file .env.production -f compose.production.yaml up -d && \
            SOURCEWIKI_API_IMAGE='$SOURCEWIKI_API_IMAGE' SOURCEWIKI_WEB_IMAGE='$SOURCEWIKI_WEB_IMAGE' docker compose --env-file .env.production -f compose.production.yaml ps"

      - name: HTTPS smoke
        run: |
          BASE_URL="https://${{ secrets.APP_DOMAIN }}"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/api/health/live"
          curl --fail --retry 10 --retry-delay 5 "$BASE_URL/api/health/ready"
          curl --fail --retry 5 --retry-delay 3 "$BASE_URL/api/openapi.json"
          curl --fail --retry 5 --retry-delay 3 "$BASE_URL/api/docs/"
